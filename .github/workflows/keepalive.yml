name: Grok Bot 24x7 Keep-Alive Watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Execute Watchdog Heartbeat
        env:
          GROK_TOKEN: ${{ secrets.GROK_TOKEN }}
        run: |
          python keepalive.py
